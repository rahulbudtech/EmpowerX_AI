name: EmpowerX AI CI/CD

on:
  pull_request:
    branches:
      - bud_development
  push:
    branches:
      - bud_development

permissions:
  contents: read

concurrency:
  group: empowerx-ai-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and test tools
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Compile and import the application
        run: |
          set -euo pipefail
          python -m compileall -f -q app migrations
          python -c "import app.main, app.workers.celery_app"

      - name: Static deployment checks
        run: |
          set -euo pipefail
          bash deploy/bin/run-static-checks.sh

      - name: Run tests
        run: |
          set -euo pipefail
          set +e
          output="$(python -m pytest -ra --tb=short)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -ne 0 ]]; then
            exit "$status"
          fi
          if printf '%s\n' "$output" | grep -E 'skipped|no tests ran|collected 0 items'; then
            echo "Refusing to treat skipped or absent tests as success"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/bud_development'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload release and deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          EMPOWERX_AI_ALLOW_MIGRATIONS: ${{ vars.EMPOWERX_AI_ALLOW_MIGRATIONS }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          chmod 600 "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          export EMPOWERX_AI_SSH_IDENTITY="$RUNNER_TEMP/ssh/id"
          export EMPOWERX_AI_KNOWN_HOSTS="$RUNNER_TEMP/ssh/known_hosts"
          bash deploy/bin/remote-deploy.sh "$GITHUB_SHA"
