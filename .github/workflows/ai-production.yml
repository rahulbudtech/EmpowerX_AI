name: EmpowerX AI Production

on:
  pull_request:
    branches:
      - production
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: empowerx-ai-production-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile and import the application
        run: |
          set -euo pipefail
          python -m compileall -f -q app migrations
          python -c "import app.main, app.workers.celery_app"
          python -m py_compile deploy/production/lib/validate_archive.py deploy/production/lib/migrate.py
          bash -n deploy/production/bin/package.sh
          bash -n deploy/production/bin/remote-deploy.sh
          bash -n deploy/production/bin/deploy.sh
          bash -n deploy/production/bin/healthcheck.sh
          bash -n deploy/production/bin/rollback.sh
          bash -n deploy/production/bin/receive-artifact.sh
          bash -n deploy/production/vps/install.sh
          bash -n deploy/production/vps/empowerx-ai-prod
          bash -n deploy/production/vps/empowerx-ai-prod-shell

      - name: Run tests
        run: |
          set -euo pipefail
          python -m pytest tests/deploy/test_production.py tests/deploy/test_deployment.py -ra --tb=short

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload release and deploy
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id"
          chmod 600 "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          export EMPOWERX_AI_SSH_IDENTITY="$RUNNER_TEMP/ssh/id"
          export EMPOWERX_AI_KNOWN_HOSTS="$RUNNER_TEMP/ssh/known_hosts"
          bash deploy/production/bin/remote-deploy.sh "$GITHUB_SHA"
